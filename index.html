
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Natnael Haile | Cybersecurity Portfolio">
<title>Natnael Haile | Cybersecurity Portfolio">

<style>
:root {
  --bg: #03101f;
  --navy: #071b2d;
  --panel: rgba(4, 20, 37, .91);
  --orange: #ff713b;
  --cyan: #36cfff;
  --text: #f0f7ff;
  --muted: #b7c9d9;
  --line: #275572;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  line-height: 1.6;
  background:
    radial-gradient(
      ellipse at 100% 5%,
      #ff713b25,
      transparent 35%
    ),
    radial-gradient(
      ellipse at 0% 70%,
      #0b63932b,
      transparent 35%
    ),
    var(--bg);
}

a { color: inherit; }

button {
  font: inherit;
  cursor: pointer;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 4px;
}

[hidden] { display: none !important; }

.container {
  width: min(1160px, calc(100% - 36px));
  margin-inline: auto;
}

.orange { color: var(--orange); }

.cyan { color: var(--cyan); }

/* NAVIGATION */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(3, 13, 27, .93);
  border-bottom: 1px solid #28506b;
  backdrop-filter: blur(16px);
}

nav {
  min-height: 67px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 12px;
  white-space: nowrap;
}

.brand-mark {
  font-size: 28px;
  font-weight: 900;
  color: var(--orange);
}

.brand-name {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 600;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
}

.nav-links a {
  font-size: 13px;
  text-decoration: none;
  transition: color .2s;
}

.nav-links a:hover { color: var(--orange); }

.nav-resume {
  border: 1px solid var(--orange);
  border-radius: 7px;
  padding: 8px 14px;
}

.menu-button {
  display: none;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 7px 12px;
  background: var(--navy);
  color: white;
}

/* HERO */

.hero {
  position: relative;
  isolation: isolate;
  min-height: 480px;
  display: flex;
  align-items: center;
  overflow: hidden;
  border-bottom: 1px solid #e46d39;
  background:
    linear-gradient(
      90deg,
      #03101ffb 0%,
      #03101fe8 32%,
      #03101f5c 65%,
      #03101f12 100%
    ),
    url("assets/hero-soc.jpg") center right / cover no-repeat;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(
      90deg,
      rgba(3, 16, 31, .7),
      transparent 75%
    );
}

.hero-content {
  max-width: 660px;
  padding: 75px 0;
}

.eyebrow {
  color: var(--cyan);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
}

.hero h1 {
  margin: 13px 0 8px;
  font-size: clamp(49px, 6vw, 76px);
  line-height: 1.1;
  letter-spacing: -2px;
}

.hero-role {
  font-size: 16px;
  font-weight: 600;
}

.hero-description {
  color: var(--muted);
  max-width: 500px;
  margin-top: 13px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin: 27px 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  padding: 12px 23px;
  border-radius: 7px;
  transition: transform .2s, box-shadow .2s;
}

.btn:hover { transform: translateY(-3px); }

.btn-primary {
  color: white;
  border: 1px solid #ffb275;
  background: linear-gradient(120deg, #f76b31, #a82f17);
  box-shadow: 0 0 22px #ff713b65;
}

.btn-secondary {
  background: rgba(3, 17, 33, .9);
  border: 1px solid #3c7799;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 25px;
  margin-top: 28px;
}

.stat {
  padding-right: 25px;
  border-right: 1px solid #2b526a;
}

.stat:last-child { border-right: 0; }

.stat strong {
  display: block;
  font-size: 26px;
  line-height: 1.2;
  color: var(--orange);
}

.stat span {
  font-size: 12px;
  color: var(--muted);
}

/* COMMON SECTION DESIGN */

section { scroll-margin-top: 85px; }

.section {
  margin-top: 18px;
}

.panel {
  position: relative;
  overflow: hidden;
  padding: 28px;
  border: 1px solid #36627c;
  border-radius: 14px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  box-shadow: 0 15px 35px #0008;
}

.panel.glow {
  border-color: #b7633f;
  box-shadow:
    0 0 22px #ff713b20,
    0 15px 35px #0008;
}

.section-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--cyan);
  letter-spacing: 2px;
}

.section-label::before {
  content: "// ";
  color: var(--orange);
}

.section-title {
  font-size: clamp(24px, 3vw, 33px);
  line-height: 1.2;
  margin: 8px 0 18px;
}

.muted { color: var(--muted); }

/* ABOUT */

.about-panel {
  background:
    linear-gradient(
      90deg,
      rgba(3, 18, 35, .98) 0%,
      rgba(3, 18, 35, .94) 42%,
      rgba(3, 18, 35, .48) 100%
    ),
    url("assets/about-globe.jpg") center right / cover no-repeat;
}

.about-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  align-items: end;
  gap: 35px;
  min-height: 285px;
}

.about-copy p {
  color: var(--muted);
  font-size: 14px;
  max-width: 510px;
}

.about-features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.feature {
  min-height: 130px;
  padding: 16px 12px;
  border: 1px solid #2c6785;
  border-radius: 10px;
  background: rgba(5, 29, 50, .89);
  backdrop-filter: blur(10px);
}

.feature-icon {
  color: var(--cyan);
  font-size: 28px;
  line-height: 1;
}

.feature strong {
  display: block;
  font-size: 13px;
  margin: 12px 0 5px;
}

.feature p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
}

/* SKILLS */

.skills-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.skill {
  padding: 17px 8px;
  text-align: center;
  background: rgba(7, 36, 60, .94);
  border: 1px solid #245675;
  border-radius: 9px;
}

.skill-icon {
  font-size: 29px;
  line-height: 1.3;
  color: var(--cyan);
}

.skill strong {
  display: block;
  margin: 7px 0 2px;
  font-size: 13px;
}

.skill small {
  color: var(--muted);
  font-size: 11px;
}

/* PROJECTS */

.project-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.project-card {
  overflow: hidden;
  border: 1px solid #2c6583;
  border-radius: 10px;
  background: rgba(5, 28, 49, .96);
  transition: transform .2s, border-color .2s;
}

.project-card:hover {
  transform: translateY(-4px);
  border-color: var(--orange);
}

.project-photo {
  height: 150px;
  position: relative;
  overflow: hidden;
}

.project-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.project-number {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  background: #07192dec;
  border: 1px solid var(--orange);
  border-radius: 50%;
  box-shadow: 0 0 12px #ff713b65;
  font-size: 12px;
}

.project-body { padding: 17px; }

.project-body h3 {
  font-size: 17px;
  margin: 0 0 7px;
}

.project-body p {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 12px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
}

.tag {
  font-size: 10px;
  color: #9be2ff;
  border: 1px solid #296c90;
  border-radius: 20px;
  padding: 3px 9px;
  background: #092b46;
}

.project-link {
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--orange);
  font-size: 13px;
  font-weight: 700;
}

.project-link:hover { text-decoration: underline; }

.more-projects {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

.mini-project {
  background: rgba(7, 35, 57, .94);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px;
}

.mini-project h3 { margin: 0 0 6px; }

.mini-project p {
  margin: 0 0 10px;
  font-size: 13px;
  color: var(--muted);
}

.project-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.project-header .section-title { margin-bottom: 0; }

.outline-button {
  color: white;
  background: rgba(4, 18, 32, .9);
  border: 1px solid var(--orange);
  border-radius: 7px;
  padding: 9px 16px;
  font-size: 12px;
  box-shadow: 0 0 15px #ff713b2b;
}

.back {
  color: var(--orange);
  border: 0;
  background: transparent;
  margin-bottom: 20px;
  padding: 0;
}

.soc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.soc-card {
  color: white;
  text-align: left;
  padding: 20px;
  background: #09283f;
  border: 1px solid #2e6280;
  border-radius: 10px;
}

.soc-card:hover { border-color: var(--orange); }

.soc-card strong { display: block; }

.soc-card p {
  font-size: 13px;
  color: var(--muted);
}

.detail-box {
  margin-top: 15px;
  background: #08263e;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
}

.detail-box a { color: var(--cyan); }

/* EXPERIENCE */

.organization {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 10px 0 18px;
}

.org-logo {
  width: 78px;
  height: 70px;
  flex: 0 0 78px;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid #ff9b69;
  border-radius: 12px;
  overflow: hidden;
  padding: 9px;
}

.org-logo img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.logo-fallback {
  display: none;
  color: #101820;
  font-weight: 800;
  font-size: 15px;
}

.organization h2 {
  margin: 0;
  font-size: clamp(25px, 3vw, 34px);
}

.experience-card {
  background: rgba(7, 30, 50, .93);
  border: 1px solid #2c5c79;
  border-radius: 11px;
  padding: 22px;
  margin-top: 15px;
}

.experience-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
}

.experience-heading h3 { margin: 0; }

.company {
  color: var(--cyan);
  font-weight: 700;
  font-size: 14px;
}

.date {
  color: #ffc078;
  font-size: 13px;
  white-space: nowrap;
}

.experience-card ul {
  color: var(--muted);
  padding-left: 21px;
  font-size: 14px;
}

.experience-card li { margin: 8px 0; }

.experience-card li::marker { color: var(--orange); }

.experience-skills {
  color: #b8d4e5;
  font-size: 12px;
  padding-top: 13px;
  border-top: 1px solid #31536b;
}

/* EDUCATION AND CONTACT */

.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 18px;
}

.bottom-grid .panel { height: 100%; }

.education-logo {
  width: 70px;
  height: 70px;
  flex-basis: 70px;
}

.contact-panel {
  background:
    linear-gradient(
      90deg,
      rgba(4, 20, 37, .98),
      rgba(4, 20, 37, .8)
    ),
    url("assets/sunset-skyline.jpg") right center / cover no-repeat;
}

.contact-links {
  display: grid;
  gap: 11px;
}

.contact-links a {
  color: #87dcff;
  font-size: 14px;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.contact-links a:hover {
  color: var(--orange);
  text-decoration: underline;
}

footer {
  padding: 35px 15px;
  text-align: center;
  font-size: 12px;
  color: #9ab2c4;
}

/* RESPONSIVE */

@media (max-width: 900px) {
  .menu-button { display: block; }

  .nav-links {
    display: none;
    position: absolute;
    top: 67px;
    left: 0;
    right: 0;
    background: #051727;
    border-bottom: 1px solid var(--line);
    padding: 20px;
    flex-direction: column;
    align-items: stretch;
  }

  .nav-links.open { display: flex; }

  .about-grid { grid-template-columns: 1fr; }

  .about-features { max-width: 700px; }

  .skills-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 700px) {
  .hero {
    min-height: 520px;
    background-position: 58% center;
  }

  .hero-content { padding: 60px 0; }

  .hero h1 { font-size: 50px; }

  .panel { padding: 20px; }

  .project-grid,
  .soc-grid,
  .bottom-grid,
  .more-projects {
    grid-template-columns: 1fr;
  }

  .skills-grid { grid-template-columns: repeat(2, 1fr); }

  .about-features { grid-template-columns: 1fr; }

  .experience-heading {
    flex-direction: column;
    gap: 4px;
  }

  .date { white-space: normal; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>

<body>

<!-- NAVIGATION -->

<header>
  <nav class="container">
    <a href="#home" class="brand">
      <span class="brand-mark">NH</span>
      <span class="brand-name">NATNAEL HAILE</span>
    </a>

    <button
      id="menuButton"
      class="menu-button"
      aria-label="Toggle menu"
      aria-expanded="false"
    >☰</button>

    <div id="navLinks" class="nav-links">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>

      <a href="#experience">Experience</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>
</header>

<main>

<!-- HERO -->

<section class="hero" id="home">
  <div class="container">
    <div class="hero-content">

      <div class="eyebrow">
        // CYBERSECURITY PORTFOLIO
      </div>

      <h1>
        Natnael <span class="orange">Haile</span>
      </h1>

      <div class="hero-role">
        Aspiring SOC Analyst | Security Monitoring |
        Incident Response
      </div>

      <p class="hero-description">
        Building a safer digital world through continuous
        learning, hands-on cybersecurity projects,
        and a passion for security.
      </p>

      <div class="buttons">
        <a href="#projects" class="btn btn-primary">
          View My Projects →
        </a>

        <a href="#contact" class="btn btn-secondary">
          Contact Me →
        </a>
      </div>

      <div class="stats">
        <div class="stat">
          <strong>5</strong>
          <span>Featured Projects</span>
        </div>

        <div class="stat">
          <strong>3</strong>
          <span>Amazon Roles</span>
        </div>

        <div class="stat">
          <strong>100%</strong>
          <span>Driven to Learn</span>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ABOUT -->

<section class="container section" id="about">
  <div class="panel glow about-panel">

    <div class="section-label">ABOUT ME</div>

    <div class="about-grid">
      <div class="about-copy">
        <h2 class="section-title">
          Turning Curiosity into
          <span class="orange">Cybersecurity Impact</span>
        </h2>

        <p>
          I'm Natnael Haile, an Information Technology
          student concentrating in Cybersecurity at
          George Mason University.
        </p>

        <p>
          I'm building hands-on experience in security
          monitoring, threat detection, and investigation
          using Wazuh SIEM, Sysmon, Kali Linux, Windows,
          and Hyper-V.
        </p>

        <p>
          My goal is to become a SOC Analyst and apply
          both my technical skills and leadership
          experience to protecting digital systems.
        </p>

        <a href="#skills" class="btn btn-secondary">
          More About My Skills →
        </a>
      </div>

      <div class="about-features">
        <div class="feature">
          <div class="feature-icon">♧</div>
          <strong>Always Learning</strong>
          <p>
            Exploring new tools, techniques, and
            security challenges.
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">⚙</div>
          <strong>Problem Solver</strong>
          <p>
            Analyzing problems and developing
            practical solutions.
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">◎</div>
          <strong>Impact Driven</strong>
          <p>
            Committed to contributing to a
            safer digital future.
          </p>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- SKILLS -->

<section class="container section" id="skills">
  <div class="panel glow">
    <div class="section-label">TECHNICAL SKILLS</div>

    <h2 class="section-title">
      Tools & Technologies
    </h2>

    <div class="skills-grid">
      <div class="skill">
        <div class="skill-icon">⌘</div>
        <strong>Linux</strong>
        <small>Kali, Ubuntu</small>
      </div>

      <div class="skill">
        <div class="skill-icon">▦</div>
        <strong>Windows</strong>
        <small>Windows 11, Sysmon</small>
      </div>

      <div class="skill">
        <div class="skill-icon">⛨</div>
        <strong>SIEM</strong>
        <small>Wazuh</small>
      </div>

      <div class="skill">
        <div class="skill-icon">∿</div>
        <strong>Network Analysis</strong>
        <small>Wireshark, TCP/IP</small>
      </div>

      <div class="skill">
        <div class="skill-icon">◎</div>
        <strong>Vulnerability Scanning</strong>
        <small>Nmap, Nikto</small>
      </div>

      <div class="skill">
        <div class="skill-icon">☁</div>
        <strong>Cloud</strong>
        <small>AWS Fundamentals</small>
      </div>

      <div class="skill">
        <div class="skill-icon">⌨</div>
        <strong>Databases</strong>
        <small>MySQL, SQL</small>
      </div>

      <div class="skill">
        <div class="skill-icon">◇</div>
        <strong>Security Frameworks</strong>
        <small>CIS, STIG, OWASP</small>
      </div>
    </div>
  </div>
</section>

<!-- PROJECTS -->

<section class="container section" id="projects">
  <div class="panel glow">

    <div id="projectHome">
      <div class="project-header">
        <div>
          <div class="section-label">FEATURED PROJECTS</div>
          <h2 class="section-title">
            Hands-On Cybersecurity
            <span class="orange">Projects</span>
          </h2>
        </div>

        <button class="outline-button" id="toggleMore">
          View All Projects →
        </button>
      </div>

      <div class="project-grid">

        <article class="project-card">
          <div class="project-photo">
            <img src="assets/project-soc.jpg"
                 alt="SOC workstation with security dashboards">
            <span class="project-number">01</span>
          </div>

          <div class="project-body">
            <h3>SOC Home Lab</h3>

            <p>
              Built a virtual SOC environment with
              Wazuh SIEM, Sysmon, Kali Linux, and
              Windows 11. Detection testing is in progress.
            </p>

            <div class="tags">
              <span class="tag">Wazuh</span>
              <span class="tag">Sysmon</span>
              <span class="tag">Kali Linux</span>
              <span class="tag">Windows</span>
            </div>

            <button class="project-link" data-project="soc">
              View Project →
            </button>
          </div>
        </article>

        <article class="project-card">
          <div class="project-photo">
            <img src="assets/project-network.jpg"
                 alt="Security code and network analysis">
            <span class="project-number">02</span>
          </div>

          <div class="project-body">
            <h3>Vulnerability Assessment</h3>

            <p>
              Exploring network discovery, security
              weaknesses, risk assessment, and
              mitigation recommendations.
            </p>

            <div class="tags">
              <span class="tag">Nmap</span>
              <span class="tag">Security</span>
              <span class="tag">Assessment</span>
            </div>

            <button class="project-link"
                    data-project="vulnerability">
              View Project →
            </button>
          </div>
        </article>

        <article class="project-card">
          <div class="project-photo">
            <img src="assets/project-forensics.jpg"
                 alt="Digital forensic investigation screen">
            <span class="project-number">03</span>
          </div>

          <div class="project-body">
            <h3>Phishing Analysis</h3>

<script>
// MOBILE MENU

const menuButton = document.getElementById("menuButton");
const navLinks = document.getElementById("navLinks");

menuButton.addEventListener("click", () => {
  const open = navLinks.classList.toggle("open");
  menuButton.setAttribute("aria-expanded", String(open));
  menuButton.textContent = open ? "✕" : "☰";
});

document.querySelectorAll(".nav-links a").forEach(link => {
  link.addEventListener("click", () => {
    navLinks.classList.remove("open");
    menuButton.setAttribute("aria-expanded", "false");
    menuButton.textContent = "☰";
  });
});

// PROJECT DATA

const projects = {
  logs: {
    title: "Log Analysis",
    description: "Wazuh, Sysmon, and Windows log review.",
    overview:
      "Review Windows Event Logs, Sysmon telemetry, " +
      "and Wazuh records to investigate endpoint activity. " +
      "Log collection is configured; detection testing " +
      "and documentation are in progress.",
    tools: "Wazuh SIEM, Sysmon, Windows Event Viewer",
    parent: "soc"
  },

  triage: {
    title: "SOC L1 Triage",
    description: "Security alert investigation workflow.",
    overview:
      "Develop a process for reviewing alerts, validating " +
      "suspicious activity, assessing severity, documenting " +
      "findings, and determining escalation needs.",
    tools: "Wazuh, MITRE ATT&CK, Alert Triage",
    parent: "soc"
  },

  ai: {
    title: "AI SOC Analysis",
    description: "AI-assisted security event interpretation.",
    overview:
      "Explore the use of AI to support security analysis " +
      "while independently checking conclusions against " +
      "original evidence and log records.",
    tools: "Wazuh, AI Analysis, Evidence Verification",
    parent: "soc"
  },

  vulnerability: {
    title: "Vulnerability Assessment",
    description: "Identifying and evaluating weaknesses.",
    overview:
      "A project exploring authorized network scanning, " +
      "vulnerability identification, risk prioritization, " +
      "and remediation recommendations.",
    tools: "Nmap, Security Assessment, Risk Analysis",
    parent: "home"
  },

  phishing: {
    title: "Phishing Analysis",
    description: "Suspicious email analysis.",
    overview:
      "Examine sender information, email headers, " +
      "suspicious URLs, and possible indicators of compromise.",
    tools: "Email Header Analysis, URL Analysis, IOC Review",
    parent: "home"
  },

  controls: {
    title: "Security Controls Assessment",
    description: "Security configuration evaluation.",
    overview:
      "Evaluate technical security controls against " +
      "recognized security guidance and document " +
      "mitigation recommendations.",
    tools: "CIS Benchmarks, STIG, OWASP Top 10",
    parent: "home"
  },

  yoga: {
    title: "Yoga Class Registration System",
    description: "MySQL database project.",
    overview:
      "Database work involving client records, " +
      "class check-ins, views, stored procedures, " +
      "and access permissions.",
    tools: "MySQL, SQL, Database Design",
    parent: "home"
  }
};

const projectHome = document.getElementById("projectHome");
const socHome = document.getElementById("socHome");
const details = document.getElementById("projectDetails");

let currentParent = "home";

function showView(view) {
  projectHome.hidden = view !== "home";
  socHome.hidden = view !== "soc";
  details.hidden = view !== "details";

  document.getElementById("projects").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

document.querySelectorAll("[data-project]").forEach(button => {
  button.addEventListener("click", () => {
    const id = button.dataset.project;

    if (id === "soc") {
      showView("soc");
      return;
    }

    const project = projects[id];
    if (!project) return;

    currentParent = project.parent;

    document.getElementById("detailTitle").textContent =
      project.title;

    document.getElementById("detailDescription").textContent =
      project.description;

    document.getElementById("detailOverview").textContent =
      project.overview;

    document.getElementById("detailTools").textContent =
      project.tools;

    showView("details");
  });
});

document.getElementById("backToProjects")
  .addEventListener("click", () => showView("home"));

document.getElementById("backFromDetails")
  .addEventListener("click", () => showView(currentParent));

document.querySelectorAll('a[href="#projects"]')
  .forEach(link => {
    link.addEventListener("click", () => {
      projectHome.hidden = false;
      socHome.hidden = true;
      details.hidden = true;
    });
  });

// VIEW ALL PROJECTS

const toggleMore = document.getElementById("toggleMore");
const moreProjects = document.getElementById("moreProjects");

toggleMore.addEventListener("click", () => {
  moreProjects.hidden = !moreProjects.hidden;

  toggleMore.textContent = moreProjects.hidden
    ? "View All Projects →"
    : "Show Fewer Projects ↑";
});

// FOOTER

document.getElementById("year").textContent =
  new Date().getFullYear();
